name: Sync from TIKAZ AI Skills
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
jobs:
  sync:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve immutable canonical commit
        id: canonical
        shell: powershell
        run: |
          $line = git ls-remote https://github.com/TIKAZI/TIKAZ-AI-Skills.git refs/heads/main
          $sha = ($line -split '\s+')[0]
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "Could not resolve canonical main commit" }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@v5
        with:
          repository: TIKAZI/TIKAZ-AI-Skills
          ref: ${{ steps.canonical.outputs.sha }}
          path: _canonical
      - name: Rebuild distribution
        shell: powershell
        run: |
          python .\_canonical\scripts\validate_compatibility.py
          if ($LASTEXITCODE -ne 0) { throw "Canonical compatibility validation failed" }
          python .\_canonical\scripts\export_distribution.py --suite context-economy --output .\_publish
          if ($LASTEXITCODE -ne 0) { throw "Distribution export failed" }
          git rm -r --ignore-unmatch .
          Get-ChildItem .\_publish -Force | Copy-Item -Destination . -Recurse -Force
          Remove-Item .\_canonical, .\_publish -Recurse -Force
      - name: Validate
        shell: powershell
        run: |
          .\scripts\validate_distribution.ps1
      - name: Commit canonical update
        shell: powershell
        run: |
          git config user.name "TIKAZ"
          git config user.email "288499007+TIKAZI@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { Write-Host "Already current"; exit 0 }
          git commit -m "chore: sync context-economy from canonical collection"
          git push

