<svg width="1200" height="170" viewBox="0 0 1200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="proof-title">
<title id="proof-title">100%: 14 fixed cases; Precision@5 is also 100%. 94.44%: 12 frozen adversarial cases; failures stay public. 46/46: Literal recall on declared protected facts. 69.7%: Six fixed tasks: 4,698 to 1,422 estimated tokens</title>
<style>
.value { fill: #60A5FA; font: 750 54px "Segoe UI", Arial, sans-serif; }
.label { color: #334155; font: 600 24px/1.3 "Segoe UI", "Microsoft YaHei", Arial, sans-serif; text-align: center; }
@media (prefers-color-scheme: dark) { .label { color: #CBD5E1; } }
</style>
<g class="proof" aria-label="14 fixed cases; Precision@5 is also 100%"><text class="value" x="150" y="70" text-anchor="middle">100%</text><foreignObject x="15" y="91" width="270" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="label">Bilingual Recall@5</div></foreignObject></g><g class="proof" aria-label="12 frozen adversarial cases; failures stay public"><text class="value" x="450" y="70" text-anchor="middle">94.44%</text><foreignObject x="315" y="91" width="270" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="label">Challenge Recall@3</div></foreignObject></g><g class="proof" aria-label="Literal recall on declared protected facts"><text class="value" x="750" y="70" text-anchor="middle">46/46</text><foreignObject x="615" y="91" width="270" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="label">Protected facts retained</div></foreignObject></g><g class="proof" aria-label="Six fixed tasks: 4,698 to 1,422 estimated tokens"><text class="value" x="1050" y="70" text-anchor="middle">69.7%</text><foreignObject x="915" y="91" width="270" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="label">Fixed long-context reduction</div></foreignObject></g>
</svg>