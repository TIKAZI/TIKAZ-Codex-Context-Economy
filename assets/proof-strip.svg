<title id="proof-title">100%: 14 fixed cases; Precision@5 is also 100%. 20/20: Fixed documents, OCR, web, media, code, table, and archive cases. 53/53: Literal recall on declared facts in the checked acceptance set. 89.57%: Seven fixed context cases; not provider telemetry</title>
