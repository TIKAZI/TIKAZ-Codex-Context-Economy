<svg width="1200" height="170" viewBox="0 0 1200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="proof-title">
<title id="proof-title">100%: 14 个固定样例；Precision@5 同为 100%. 94.44%: 12 个冻结对抗样例；失败结果保持公开. 46/46: 声明保护事实的字面召回，不等同语义准确率. 69.7%: 6 个固定任务：估算 Token 从 4,698 降至 1,422</title>
<style>
.value { fill: #60A5FA; font: 750 54px "Segoe UI", Arial, sans-serif; }
.label { color: #334155; font: 600 24px/1.3 "Segoe UI", "Microsoft YaHei", Arial, sans-serif; text-align: center; }
@media (prefers-color-scheme: dark) { .label { color: #CBD5E1; } }
</style>
<g class="proof" aria-label="14 个固定样例；Precision@5 同为 100%"><text class="value" x="150" y="70" text-anchor="middle">100%</text><foreignObject x="15" y="91" width="270" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="label">双语检索 Recall@5</div></foreignObject></g><g class="proof" aria-label="12 个冻结对抗样例；失败结果保持公开"><text class="value" x="450" y="70" text-anchor="middle">94.44%</text><foreignObject x="315" y="91" width="270" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="label">对抗集 Recall@3</div></foreignObject></g><g class="proof" aria-label="声明保护事实的字面召回，不等同语义准确率"><text class="value" x="750" y="70" text-anchor="middle">46/46</text><foreignObject x="615" y="91" width="270" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="label">保护事实字面保留</div></foreignObject></g><g class="proof" aria-label="6 个固定任务：估算 Token 从 4,698 降至 1,422"><text class="value" x="1050" y="70" text-anchor="middle">69.7%</text><foreignObject x="915" y="91" width="270" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="label">固定长上下文估算减少</div></foreignObject></g>
</svg>